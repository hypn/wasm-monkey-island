<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret of Monkey Island Demo (WASM)</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b12; --fg:#e8e8f0; --accent:#6cf; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:0 16px; box-sizing:border-box; }
  #wrap { width:min(100%, calc((100vh - 90px) * 1.6)); }
  canvas { width:100%; aspect-ratio:320/200; image-rendering:pixelated; background:#000; display:block; cursor:crosshair; border:1px solid #333; }
  #status { min-height:1.4em; color:#9ab; }
  small { color:#789; }
  #menubtn { font:inherit; font-weight:700; color:#fff; background:#1e8e98; border:1px solid #3ac; border-radius:8px; padding:4px 14px; cursor:pointer; }
  #escbtn { font:inherit; font-weight:700; color:#fff; background:#7a3a8e; border:1px solid #b6c; border-radius:8px; padding:4px 14px; cursor:pointer; }
  #escbtn:active { background:#a455c0; }
  #menubtn:hover:not(:disabled) { background:#40c4ce; }
  #menubtn:disabled { opacity:.45; cursor:default; }
  #dbglink { color:#9ab; }
  #dbg { border:1px solid #3ac; border-radius:10px; background:#12121c; color:var(--fg); padding:14px 16px; width:min(92vw,760px); max-height:86vh; }
  #dbg::backdrop { background:rgba(0,0,0,.6); }
  #dbg h3 { margin:0 0 8px; } #dbg pre { margin:8px 0; padding:8px; background:#07070d; border:1px solid #333; border-radius:6px; max-height:48vh; overflow:auto; font:12px/1.35 ui-monospace,monospace; white-space:pre-wrap; word-break:break-all; }
  #dbg .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; } #dbg button { font:inherit; color:#fff; background:#1e8e98; border:1px solid #3ac; border-radius:6px; padding:3px 12px; cursor:pointer; }
  #bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
  /* touch devices: the game fills the screen; buttons sit beside it (landscape) or under it (portrait); no hint text */
  body.mobile { position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; gap:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action:manipulation; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body.mobile #wrap { width:100%; }
  body.mobile canvas { border:0; }
  body.mobile small, body.mobile .k { display:none; }
  body.mobile #status:empty { display:none; }
  body.mobile #bar { gap:10px; }
  body.mobile #bar button { min-width:84px; min-height:44px; font-size:15px; white-space:nowrap; }
  @media (orientation: portrait) { body.mobile { flex-direction:column; justify-content:flex-start; } body.mobile #wrap { margin-top:8px; } body.mobile #bar { margin-top:12px; } }
  @media (orientation: landscape) {
    body.mobile { flex-direction:row; justify-content:center; align-items:center; }
    body.mobile #wrap { width:auto; height:100%; flex:0 1 auto; display:flex; align-items:center; }
    body.mobile canvas { height:100%; width:auto; max-width:calc(100vw - 170px - env(safe-area-inset-left) - env(safe-area-inset-right)); aspect-ratio:320/200; object-fit:contain; }
    body.mobile #status { position:fixed; left:8px; top:8px; }
    body.mobile #bar { flex-direction:column; flex:0 0 auto; margin-left:12px; width:130px; }
    body.mobile #bar button { width:100%; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="320" height="200" tabindex="0"></canvas></div>
<div id="status">Loading…</div>
<dialog id="dbg"><h3>Debug info</h3><pre id="dbgsum"></pre>
  <details><summary>Full JSON (state, actors, scripts, inventory, objects, variables, flags, save data)</summary><pre id="dbgjson"></pre></details>
  <div class="row"><button id="dbgrefresh">Refresh</button><button id="dbgcopy">Copy JSON</button><button id="dbgdl">Download</button><button id="dbgclose">Close</button></div></dialog>
<div id="bar"><button id="escbtn" hidden title="Skip cutscene / cancel (Esc)">Esc</button><button id="menubtn" disabled title="Save / load (F5)"><span class="k">F5 &nbsp;</span>Save / Load</button><small>ESC skips cutscenes. Saves go to browser storage. Music: the AdLib theme plays once you have clicked or pressed a key (browser autoplay rules).</small> <small><a href="#" id="dbglink">[debug]</a></small></div>
<script>
/*__DATA__*/
</script>
<script>
/*__MI_JS__*/
</script>
<script>
(async function () {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('mobile', isMobile);
  const status = document.getElementById('status');
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(320, 200);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  try {
    const mod = await MI();
    const put = (bytes) => { const p = mod._mi_alloc(bytes.length); if (!p) throw new Error('out of memory loading game data (' + bytes.length + ' bytes)'); mod.HEAPU8.set(bytes, p); return p; };
    const putTmp = (bytes, fn) => { const p = put(bytes); try { return fn(p); } finally { mod._mi_free(p); } };   // engine keeps its own copy
    // data source: the embedded shareware demo by default; ?retail=true fetches the retail game files from the folder "retail/"
    // (needs http(s): browsers block fetch() from file://)
    const q = new URLSearchParams(location.search);
    const base = (q.get('retail') === 'true' || q.get('retail') === '1') ? 'retail/' : null;
    window.__saveNs = base === null ? 'demo' : 'retail';   // saves are kept per game in localStorage
    let disks = [], index, charsets = {};
    if (base === null) {
      disks = [b64(MI_DATA.lec)]; index = b64(MI_DATA.idx);
      for (const [id, s] of Object.entries(MI_DATA.charsets)) charsets[id] = b64(s);
    } else {
      status.textContent = 'Loading game data from ' + base + ' …';
      const get = async (name, optional) => {
        let r; try { r = await fetch(base + name); } catch (e) { throw new Error('cannot fetch ' + base + name + ' (serve this page over http, not file://)'); }
        if (!r.ok) { if (optional) return null; throw new Error(base + name + ': HTTP ' + r.status); }
        return new Uint8Array(await r.arrayBuffer());
      };
      index = await get('000.LFL');
      for (let n = 1; n <= 4; n++) { const d = await get('DISK0' + n + '.LEC', n > 1); if (d) disks[n - 1] = d; else break; }
      for (const id of [1, 2, 3, 4]) { const c = await get('90' + id + '.LFL', true); if (c) charsets[id] = c; }
    }
    disks.forEach((d, n) => { const r = putTmp(d, p => mod._mi_add_disk(n, p, d.length)); if (r) throw new Error('disk ' + (n + 1) + ' rejected (' + r + ')'); });
    if (mod._mi_set_index(put(index), index.length)) throw new Error('index rejected');
    for (const [id, d] of Object.entries(charsets)) putTmp(d, p => mod._mi_charset(+id, p, d.length));
    mod._mi_start();
    // retail: skip the copy-protection wheel (needs the code sheet) and let the boot script carry on into the intro.
    if (base !== null) { for (let i = 0; i < 30; i++) mod._mi_frame(); mod._mi_start_at(0); }
    status.textContent = '';
    const toGame = (e) => {
      const r = canvas.getBoundingClientRect();
      return [Math.max(0, Math.min(319, Math.floor((e.clientX - r.left) * 320 / r.width))),
              Math.max(0, Math.min(199, Math.floor((e.clientY - r.top) * 200 / r.height)))];
    };
    canvas.addEventListener('mousemove', e => { const [x, y] = toGame(e); mod._mi_mouse_move(x, y); });
    canvas.addEventListener('mousedown', e => { const [x, y] = toGame(e); logIn('click', x, y, e.button === 2 ? 2 : 1); mod._mi_mouse_click(x, y, e.button === 2 ? 2 : 1); canvas.focus(); e.preventDefault(); });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    const keymap = { Escape: 27, Enter: 13, Backspace: 8, Tab: 9, ' ': 32, F1: 315, F2: 316, F3: 317, F4: 318, F5: 319, F6: 320, F7: 321, F8: 322, F9: 323, F10: 324 };
    window.addEventListener('keydown', e => {
      if (document.getElementById('dbg').open) return;   // debug dialog: keys go to the dialog, not the game
      let k = keymap[e.key]; if (k === undefined && e.key.length === 1) k = e.key.charCodeAt(0);
      if (k !== undefined) { logIn('key', k); mod._mi_key(k); e.preventDefault(); }
    });
    // audio: the engine synthesises AdLib (OPL2) into a ring buffer; this callback just drains it
    let actx = null, audioReady = false;
    function startAudio() {
      // iOS Safari only unlocks Web Audio from a "real" gesture end (touchend / click / pointerup / keydown) and needs the
      // context resumed (and a sound played) inside it; touchstart/mousedown do not count. The mute switch also silences
      // Web Audio unless the page asks for "playback" audio.
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      try {
        if (!actx) {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          actx = new AC(); const N = 8192, node = actx.createScriptProcessor(N, 1, 1);
          const p = mod._mi_alloc(N * 4);
          node.onaudioprocess = (e) => { const out = e.outputBuffer.getChannelData(0); mod._mi_snd_pull(p, N, actx.sampleRate); out.set(mod.HEAPF32.subarray(p >> 2, (p >> 2) + N)); };
          const mute = actx.createGain(); mute.gain.value = 1;      // keep the processor pulled by a graph that reaches the output
          node.connect(mute); mute.connect(actx.destination);
        }
        if (actx.state !== 'running') actx.resume();
        if (!audioReady) {                                           // unlock: play one silent sample inside the gesture
          const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
          audioReady = true;
        }
      } catch (e) { console.warn('audio unavailable', e); }
    }
    for (const ev of ['pointerup', 'touchend', 'click', 'mousedown', 'keydown']) window.addEventListener(ev, startAudio, { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && actx && actx.state !== 'running') actx.resume(); });
    // touch devices have no Esc key: show a button for it (skips cutscenes, cancels a chosen verb)
    window.__isMobile = isMobile;
    const escBtn = document.getElementById('escbtn'); escBtn.hidden = !isMobile;
    escBtn.addEventListener('click', () => { logIn('key', 27); mod._mi_key(27); startAudio(); escBtn.blur(); });
    const menuBtn = document.getElementById('menubtn');
    // ---- [debug] dialog: snapshot of engine state as JSON (+ the packed save so a situation can be reproduced) ----
    const dbg = document.getElementById('dbg'); let dbgData = null;
    const dbgB64 = (p, n) => { let s = ''; const h = mod.HEAPU8; for (let o = 0; o < n; o += 8192) s += String.fromCharCode.apply(null, h.subarray(p + o, p + Math.min(n, o + 8192))); return btoa(s); };
    function collectDebug() {
      const p = mod._mi_debug_json(); const h = mod.HEAPU8; let e = p; while (h[e]) e++;
      const d = JSON.parse(new TextDecoder().decode(h.subarray(p, e)));
      const sp = mod._mi_debug_save(), sn = mod._mi_debug_save_len();
      d.save_b64 = sp ? dbgB64(sp, sn) : null;
      let slots = {}; try { for (let i = 0; i < 10; i++) { const m = localStorage.getItem('mi.' + (window.__saveNs || 'demo') + '.slot' + i + '.meta'); if (m !== null) slots[i] = m; } } catch (_) {}
      d.input_log = inputLog.slice(); d.last_error = lastError; d.save_slots = slots; d.heap_bytes = mod.HEAPU8.length;
      d.client = { build: '__BUILD__', url: location.href, ua: navigator.userAgent, viewport: [innerWidth, innerHeight], dpr: devicePixelRatio, frames: window.__frames, time: new Date().toISOString() };
      return d;
    }
    function showDebug() {
      const d = dbgData = collectDebug(), ego = d.actors.find(a => a.id === d.ego);
      const sum = ['room ' + d.room + ' (' + d.room_name + ')  size ' + d.room_size.join('x') + '  camera ' + d.camera.cur + ' -> ' + d.camera.dest + ' (follow ' + d.camera.follow + ')',
        'ego (actor ' + d.ego + '): ' + (ego ? 'room ' + ego.room + ' at ' + ego.x + ',' + ego.y + ' facing ' + ego.facing + ' box ' + ego.box + (ego.moving ? ' moving' : '') : '?'),
        'mouse screen ' + d.mouse.screen.join(',') + '  room-view ' + d.mouse.virt.join(','),
        'input ' + (d.input_enabled ? 'enabled' : 'disabled') + '  cutscene slot ' + (d.cutscene_slot === 255 ? 'none' : d.cutscene_slot) + '  talking actor ' + d.talk_actor + '  ticks ' + d.ticks,
        'scripts running: ' + (d.scripts.map(s => s.script + (s.where === 1 ? '(obj)' : '') ).join(', ') || 'none'),
        'inventory: ' + (d.inventory.map(i => i.name + '#' + i.id).join(', ') || 'empty'),
        'objects here: ' + (d.objects.map(o => (o.name || '?') + '#' + o.id + (o.state ? ' s' + o.state : '')).join(', ') || 'none'),
        'vars set: ' + Object.keys(d.vars).length + '  flags set: ' + d.bits_set.length + '  save data: ' + (d.save_b64 ? d.save_b64.length + ' chars' : 'n/a'),
        'build ' + d.client.build + '  page ' + d.client.url].join('\n');
      document.getElementById('dbgsum').textContent = sum;
      document.getElementById('dbgjson').textContent = JSON.stringify(d, null, 1);
      if (!dbg.open) dbg.showModal();
    }
    document.getElementById('dbglink').addEventListener('click', e => { e.preventDefault(); showDebug(); });
    document.getElementById('dbgrefresh').addEventListener('click', showDebug);
    document.getElementById('dbgclose').addEventListener('click', () => { dbg.close(); canvas.focus(); });
    dbg.addEventListener('click', e => { if (e.target === dbg) { dbg.close(); canvas.focus(); } });
    document.getElementById('dbgcopy').addEventListener('click', async e => { const t = JSON.stringify(dbgData); try { await navigator.clipboard.writeText(t); e.target.textContent = 'Copied'; } catch (_) { const r = document.createRange(); r.selectNodeContents(document.getElementById('dbgjson')); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'Select+Ctrl-C'; } setTimeout(() => e.target.textContent = 'Copy JSON', 1500); });
    document.getElementById('dbgdl').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(dbgData, null, 1)], { type: 'application/json' })); a.download = 'monkey-debug-room' + dbgData.room + '.json'; a.click(); });
    menuBtn.addEventListener('click', () => { if (!menuBtn.disabled) { logIn('key', 319); mod._mi_key(319); } menuBtn.blur(); canvas.focus(); });
    window.__mi = mod; window.__frames = 0;
    // debug aids: the last inputs (with frame numbers) and the last engine error, included in the [debug] dump
    const inputLog = [], logIn = (...a) => { inputLog.push([window.__frames, ...a]); if (inputLog.length > 40) inputLog.shift(); };
    let lastError = null; window.addEventListener('error', e => { lastError = { message: String(e.message), stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 1500) : null, frame: window.__frames }; });
    let last = performance.now(), acc = 0; window.__speed = 1;   // test hook (set from the console / test driver), not a URL option
    function tick(now, bg) {
      acc += (now - last) * (window.__speed || 1); last = now;
      const interval = mod._mi_frame_ms();
      let n = 0;
      try {
        while (acc >= interval && n < 60) {
          if (mod._mi_frame()) { status.textContent = 'The game has ended.'; return; }
          acc -= interval; n++; window.__frames++;
        }
      } catch (err) {   // wasm trap / abort (e.g. out of memory): stop and say so instead of freezing silently; [debug] still works if the module survived
        console.error('engine error at frame ' + window.__frames, err); lastError = { message: String(err && err.message || err), stack: err && err.stack ? String(err.stack).slice(0, 1500) : null, frame: window.__frames };
        let where = ''; try { where = ' in script ' + mod._mi_last_script() + ' at pc ' + mod._mi_last_pc() + ' op 0x' + mod._mi_last_op().toString(16); } catch (_) {}
        status.textContent = 'Game stopped: ' + (err && err.message || err) + where + ' (frame ' + window.__frames + ') - open [debug] and send the JSON';
        return;
      }
      if (acc > interval * 60) acc = 0;
      if (location.hash === '#debug') status.textContent = 'frames=' + window.__frames + ' room=' + mod._mi_room();
      menuBtn.disabled = !mod._mi_menu_available();
      canvas.style.cursor = mod._mi_cursor_visible() ? 'crosshair' : 'none';
      if (n && !bg) { img.data.set(mod.HEAPU8.subarray(mod._mi_framebuffer(), mod._mi_framebuffer() + 320 * 200 * 4)); ctx.putImageData(img, 0, 0); }
      if (!bg) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    // Browsers stop requestAnimationFrame in hidden/background tabs; the engine (and the audio it synthesises per frame)
    // would stall and the music cut out. Keep stepping from a timer while hidden (audible pages are not throttled hard).
    setInterval(() => { if (document.hidden) tick(performance.now(), true); }, 30);
  } catch (err) { status.textContent = 'Error: ' + err.message; console.error(err); }
})();
</script>
</body>
</html>
